# =============================================================================
# SETUP: no placeholders to replace. Requires these scripts in your repo
# (setup.sh copies them into scripts/):
#   scripts/check_pr_lane.py, scripts/pipeline_lanes.json
#                                 — decide the PR's lane (edit the config's paths
#                                   to match your project layout)
#   scripts/check_tdd_commit_order.py, scripts/check_gate_integrity.py,
#   scripts/check_citations.py    — the deterministic gates this job runs
# Mark `gates` a required status check on develop and main in branch protection.
# =============================================================================

name: Gates

# Runs on every PR (no paths: filter) so the required `gates` check always
# reports. The gate scripts run from a base-branch checkout, so a PR cannot edit
# the script that judges it; only the PR that first adds a script falls back to
# its own copy, with a warning. The unit tests run on the PR head: they test the
# PR's own scripts. A `release`-lane PR prints its lane and passes, because its
# diff to main is the whole release delta, which every commit already passed on
# develop. Lanes are defined in scripts/pipeline_lanes.json (see scripts/check_pr_lane.py).
#
# This workflow is a gate definition: a PR editing it lands in the `pipeline`
# lane and needs an APPROVED review (checked by review-evidence.yml, which runs
# from the base branch and cannot be edited by the PR).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

concurrency:
  group: gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head
          persist-credentials: false

      - name: Checkout base branch (trusted scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false

      - name: Decide lane
        id: lane
        working-directory: head
        env:
          # Branch names are attacker-controlled: pass via env, never inline in run.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # A fork's branch never gets the release, sync or back-merge lanes (same rule as check_review_evidence.py).
          [ "$HEAD_REPO" = "$REPO" ] || HEAD_REF="fork:$HEAD_REF"
          script="$GITHUB_WORKSPACE/base/scripts/check_pr_lane.py"
          config="$GITHUB_WORKSPACE/base/scripts/pipeline_lanes.json"
          if [ ! -f "$script" ] || [ ! -f "$config" ]; then
            echo "::warning::check_pr_lane.py or pipeline_lanes.json is not on origin/$BASE_REF; using the PR head copies. Valid only for the PR that first adds them."
            script="$GITHUB_WORKSPACE/head/scripts/check_pr_lane.py"
            config="$GITHUB_WORKSPACE/head/scripts/pipeline_lanes.json"
          fi
          lane=$(python3 "$script" --git "origin/$BASE_REF" --head-branch "$HEAD_REF" --base-branch "$BASE_REF" --config "$config")
          echo "Lane: $lane"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Run deterministic gates
        if: steps.lane.outputs.lane != 'release'
        working-directory: head
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          status=0
          for script in check_tdd_commit_order.py check_gate_integrity.py check_citations.py; do
            trusted="$GITHUB_WORKSPACE/base/scripts/$script"
            if [ ! -f "$trusted" ]; then
              # Bootstrap exception: only the PR that first introduces a script
              # has no base copy to run; once merged, the base copy always wins.
              echo "::warning::scripts/$script does not exist on origin/$BASE_REF; falling back to the PR head copy, which the PR itself controls. This is only valid for the PR that first introduces the script."
              trusted="$GITHUB_WORKSPACE/head/scripts/$script"
            fi
            echo "::group::$script"
            case "$script" in
              # HEAD is detached in CI, so pass the PR's head branch explicitly.
              check_gate_integrity.py) python3 "$trusted" "origin/$BASE_REF" "$HEAD_REF" || status=1 ;;
              check_citations.py) python3 "$trusted" --base "origin/$BASE_REF" || status=1 ;;
              *) python3 "$trusted" "origin/$BASE_REF" || status=1 ;;
            esac
            echo "::endgroup::"
          done
          exit $status

      - name: Script unit tests
        if: steps.lane.outputs.lane != 'release' && hashFiles('head/scripts/tests/test_*.py') != ''
        working-directory: head
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Guard hook self-test and glob-list check
        # Runs the PR head's own hook and script, so it only catches an honest slip: the
        # hook's PROTECTED_GLOBS drifting from GUARDED_PATH_GLOBS, or a broken parser case.
        # The enforcement is the base-branch script run above, not this step.
        if: steps.lane.outputs.lane != 'release' && hashFiles('head/.claude/hooks/guard_protected_paths.py') != ''
        working-directory: head
        run: python3 .claude/hooks/guard_protected_paths.py --self-test
